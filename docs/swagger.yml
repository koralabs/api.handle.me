  "/mpt-root":
    get:
      tags:
      - utils
      summary: MPT root hash verification
      description: |
        Returns three Merkle Patricia Trie root hashes for the handle set:
        - `calculated_mpt_root_hash`: computed from the API's current handle index (plus ghost handles the on-chain validator cannot remove).
        - `datum_mpt_root_hash`: extracted from the API's cached `handle_root@handle_settings` datum (advances with the scanner as blocks are processed).
        - `chain_mpt_root_hash`: probed live from Koios (fallback Blockfrost) at provider chain tip.

        `verified` is `true` only when all three hashes are equal AND the provider's tip slot is at or ahead of our `current_slot` (otherwise the provider's view is older than ours and the comparison is not meaningful). A transient `verified: false` with `calculated === datum !== chain` simply reflects scanner lag behind the live chain tip — internal state is consistent, we just haven't applied the most recent blocks.
      responses:
        '200':
          description: MPT root hash comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  calculated_mpt_root_hash:
                    type: string
                    nullable: true
                    description: MPT root hash computed from the API's current handle set (including ghost handles).
                    example: "2411906497cba6d7713d99f101182bf48caf8730cea02ae887eeb15fdc2ce51b"
                  datum_mpt_root_hash:
                    type: string
                    nullable: true
                    description: MPT root hash decoded from the API's cached `handle_root@handle_settings` datum.
                    example: "2411906497cba6d7713d99f101182bf48caf8730cea02ae887eeb15fdc2ce51b"
                  chain_mpt_root_hash:
                    type: string
                    nullable: true
                    description: MPT root hash probed live from Koios/Blockfrost at chain tip. Null when both providers fail or return an unusable response.
                    example: "2411906497cba6d7713d99f101182bf48caf8730cea02ae887eeb15fdc2ce51b"
                  verified:
                    type: boolean
                    nullable: true
                    description: True only when all three hashes match AND `provider_tip_slot >= our_current_slot`. Null if any of the three hashes is unavailable.
                  network:
                    type: string
                    example: "mainnet"
                  provider:
                    type: string
                    nullable: true
                    description: Which provider produced `chain_mpt_root_hash`.
                    enum: [koios, blockfrost]
                  provider_tip_slot:
                    type: integer
                    nullable: true
                    description: The absolute slot at which the provider reported `chain_mpt_root_hash`.
                  our_current_slot:
                    type: integer
                    description: The absolute slot our scanner has processed up to.
  "/health":
    get:
      tags:
      - utils
      summary: Service health and scanner state
      description: |
        Returns the scanner state and storage / Ogmios sync metrics. Always emits
        `Cache-Control: no-store` so caches/CDNs cannot serve stale state.
        Status enum: `current` | `updating` | `ogmios_behind` | `storage_behind` | `waiting_on_cardano_node`.
      responses:
        '200':
          description: "Healthy and scanning is complete (`status: current`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        '202':
          description: Healthy but the scanner is still catching up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        '503':
          description: Cardano node / Ogmios is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  "/policies":
    get:
      tags:
      - utils
      summary: Get active Handle policy settings
      description: |
        Returns normalized JSON policy settings from the `handle_policies` datum.
        Policy IDs are always emitted as hex strings without the `0x` prefix.
        Each policy maps to:
        - `first_minting_slot`: first slot where minting is active
        - `last_minting_slot`: optional last minting slot (`null` when open-ended)
        - `sunset_slot`: optional sunset/deprecation slot (`null` when unset)
      responses:
        '200':
          description: Successful and up to date
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    first_minting_slot:
                      type: integer
                    last_minting_slot:
                      type: integer
                      nullable: true
                    sunset_slot:
                      type: integer
                      nullable: true
              example:
                "f0ff48bbb7bbe9d59a40f1ce90e9e9d0ff5002ec48f232b49ca0fb9a":
                  first_minting_slot: 47931333
                  last_minting_slot: null
                  sunset_slot: null
        '202':
          description: Successful, but scanning is still catching up to the tip of the blockchain
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    first_minting_slot:
                      type: integer
                    last_minting_slot:
                      type: integer
                      nullable: true
                    sunset_slot:
                      type: integer
                      nullable: true
        '400':
          description: Unable to decode policies datum
        '404':
          description: Policies datum not found
  "/datum":
    post:
      tags:
      - utils
      parameters:
      - name: from
        in: query
        description: The format of the datum being passed in
        required: true
        schema:
          $ref: "#/components/schemas/DatumType"
      - name: to
        in: query
        description: The format of the datum to encode/decode to
        required: true
        schema:
          $ref: "#/components/schemas/DatumType"
      - name: default_key_type
        in: query
        description: Default key encoding when converting CBOR maps to JSON
        required: false
        schema:
          type: string
          enum:
          - utf8
          - hex
      - name: numeric_keys
        in: query
        description: JavaScript doesn't support numeric object keys. CBOR does. If JSON keys can be converted to CBOR integers, then do so
        required: false
        schema:
          type: boolean
      - name: indefinite_arrays
        in: query
        description: |
          Whether to use CBOR "definite" or "indefinite" arrays. Defaults to `true`
          <br />`true` will wrap arrays in the `9f[...]ff` CBOR Indefinite Major Type
          <br />`false` will preceed the array with the CBOR Major Type `8n[...]` (where `n` is the length of the array)
        required: false
        schema:
          type: boolean
      - name: default_to_text
        in: query
        description: Whether strings should all be converted to CBOR byte strings or text strings. Defaults to `false`
          <br />`false` will preceed the bytes with the CBOR Major Type `4n[...]` (bytes)
          <br />`true` will preceed the bytes with the CBOR Major Type `6n[...]` (text)
        required: false
        schema:
          type: boolean
      - name: chunk_size
        in: query
        description: Strings or Buffers larger than `chunk_size` are broken into an array of strings or Buffers. 
          Defaults to `64`. As an example, "01234567890123456789" with a `chunk _size` of 10 will convert to the CBOR equivalent of
          ['0123456789', '0123456789']
        required: false
        schema:
          type: integer
      requestBody:
        description: |
          The CBOR or JSON to encode/decode.
          <br />NOTE: To insert constructors where needed, wrap the object in the format:
          <br />
          ```json
          constructor_0: [ <your_arbitrary_json> ]
          ```
          Where `"_0"` is a number from 0-3
        required: true
        content:
          application/json:
            schema:
                type: object
                example: '{ "name": "Clever Girl", "ipfs": "QmPck498Cy5TWYJS5Nifx2R84FjYjJLi6b8oHMNkfhxpS4" }'
                description: Use when passing in JSON
          text/plain:
            schema:
                type: string 
                example: |
                  a2446e616d654b436c65766572204769726c4469706673582e516d50636b3439384379355457594a53354e69667832523834466a596a4a4c693662386f484d4e6b666878705334
                description: Use when passing in CBOR
      responses:
        '200':
          description: datum was able to be encoded/decoded successfully
          content:
            application/json:
              schema:
                type: object
                example: '{ "name": "Clever Girl", "ipfs": "QmPck498Cy5TWYJS5Nifx2R84FjYjJLi6b8oHMNkfhxpS4" }'
                description: Used when the `"to:"` parameter is JSON
            text/plain:
              schema:
                type: string
                example: |
                  a2446e616d654b436c65766572204769726c4469706673582e516d50636b3439384379355457594a53354e69667832523834466a596a4a4c693662386f484d4e6b666878705334
                description: Used when the `"to:"` parameter is CBOR

        '400':
          description: datum cbor or json was in the wrong format
        '503':
          description: HTTP application failure
components:
  schemas:
    Error:
      type: object
      description: |
        Uniform error envelope returned by every 4xx/5xx response in this API.
        Agents should branch on `error` (machine-stable) rather than `message` (human prose).
      required:
      - error
      - message
      - docs
      properties:
        error:
          type: string
          description: Machine-stable error code. Values include `handle_not_found`, `handle_datum_not_found`, `subhandle_settings_not_found`, `subhandle_settings_utxo_not_found`, `script_not_found`, `policies_not_found`, `policies_decode_failed`, `datum_decode_failed`, `datum_endpoint_disabled`, `cbor_required`, `records_per_page_too_large`, `route_not_found`, `method_not_allowed`, `not_acceptable`, `rate_limited`, `holder_not_found`, `handle_type_unsupported_for_mint`, `unavailable_for_legal_reasons`, `bad_request`, `not_found`, `internal_error`.
          example: handle_not_found
        message:
          type: string
          description: Human-readable explanation. Subject to change; do not branch logic on this field.
          example: Handle not found
        docs:
          type: string
          format: uri
          description: URL pointing at the most-relevant docs for this error.
          example: https://api.handle.me/
    HealthResponse:
      type: object
      required:
      - status
      - stats
      properties:
        status:
          type: string
          enum:
          - current
          - updating
          - ogmios_behind
          - storage_behind
          - waiting_on_cardano_node
        ogmios:
          type: object
          nullable: true
        stats:
          type: object
          properties:
            percentage_complete:
              type: number
            index_memory_size:
              type: number
            slot_date:
              type: string
            handle_count:
              type: integer
            holder_count:
              type: integer
            memory_size:
              type: number
            current_slot:
              type: integer
            last_slot:
              type: integer
            current_block_hash:
              type: string
            tip_block_hash:
              type: string
            utxo_schema_version:
              type: integer
            index_schema_version:
              type: integer
            lock_lambdas:
              nullable: true
            estimated_sync_time:
              type: string
              format: date-time
    AddressType:
      type: string
      example: wallet
      description: |
        <br />If it is a Shelley address and a script, it will say `script`.
        <br />If it is Shelley, is not a script, and has a stake key, it will be `wallet`.
        <br />If it is Shelley, is not a script, and doesn't have a stake key, it will be `enterprise`.
        <br />If the address is not a Shelley address, it will be `other`.
      enum:
      - wallet
      - script
      - enterprise
      - other
    Characters:
      type: string
      example: letters,numbers,special
      description: "Included character types in the handles. Numbers includes negative
        and decimal numbers. Combining them does an 'AND' search. Ex - `letters,numbers`
        will find Handles that have both letters and numbers.
        <br />`letters` - All characters are letters
        <br />`numbers` - All characters are valid numeric characters (including decimals and negative)
        <br />`special` - All characters are dash, period, or underscore"
    DatumType:
      type: string
      example: plutus_data_cbor
      description: |
        <br />json (cardano-cli can take this with --tx-out-datum-json-value)
        <br />tx_metadata_json (aka "Detailed Schema")
        <br />tx_metadata_cbor (the actual TxMetadata CBOR bytes)
        <br />plutus_data_json (aka "Schema Json" with Plutus constructors/fields)
        <br />plutus_data_cbor (the actual PlutusData CBOR bytes)
      enum:
      - json
      - tx_metadata_json
      - tx_metadata_cbor
      - plutus_data_json
      - plutus_data_cbor
    DesignerSettings:
      type: object
      properties:
        creator_defaults_enabled:
          type: boolean
          description: True is the user elected to use the creator defaults from the chosen background
        bg_border_color:
          $ref: "#/components/schemas/HexString" 
        pfp_border_color:
          $ref: "#/components/schemas/HexString" 
        font_shadow_color:
          $ref: "#/components/schemas/HexString" 
        font_shadow_size:
          type: array
          items:
            type: integer
          example: [12, 12, 10]
          description: An array of three numbers representing vertical offset, horizontal offset, and blur radius
        pfp_image:
          type: string
          description: IPFS hash of the selected profile pic
          example: ipfs://Q2de4Fg56tNHy82300000001
        bg_image:
          type: string
          description: IPFS hash of the selected background
          example: ipfs://Q2de4Fg56tNHy82300000001
        pfp_asset:
          type: string
          description: Hex string of policy id and asset name of the pfp_image on chain asset
          example: 94da605878403d07c144fe96cd50fe20c16186dd8d171c78ed6a8768436c6179436861726c6f74746538353338
        bg_asset:
          type: string
          description: Hex string of policy id and asset name of the bg_image on chain asset
          example: b8842fe3a0eae5011252c16566995d2c8f1bae85d380410cd21ea91f000de140556e646572776f726c645f48616e646c65735f6267
        text_ribbon_colors:
          type: array
          description: The color used for the ribbon or the colors used for the gradient on the ribbon.
          items:
            $ref: "#/components/schemas/HexString" 
          example: [0a1fd3ff, 22d1af88, 31bc2399]
        qr_bg_color:
          $ref: "#/components/schemas/HexString" 
        qr_inner_eye:
          type: string
          description: Two values separated by a comma. The first is the inner eye style ('dot', 'square', 'rounded').
            The second is the inner eye color as an hex RGBA value preceded by a hash symbol
          example: "square,#FFFFFF"
        qr_outer_eye:
          type: string
          description: Two values separated by a comma. The first is the outer eye style ('dot', 'square', 'rounded').
            The second is the outer eye color as an hex RGBA value preceded by a hash symbol
          example: "square,#FFFFFF"
        qr_dot:
          type: string
          description: Two values separated by a comma. The first is the dots style ('dot', 'square', 'rounded').
            The second is the dots color as an hex RGBA value preceded by a hash symbol
          example: "square,#FFFFFF"
        qr_image:
          type: string
          description: Either the URL or the `data:image;base64` data in the center of the QR code
          example: "ipfs://Q2de4Fg56tNHy82300000001"
        font_color:
          type: string
          $ref: "#/components/schemas/HexString" 
          description: The color of the font in hex including alpha transparency
          example: 0a1fd3ff
        font:
          type: string
          example: "ShortStackMod,https://claynation.nyc3.cdn.digitaloceanspaces.com/ada_handles/ShortStackNew.ttf"
        qr_link:
          type: string
        socials: 
          type: array
          description: The url and display text of the social entries selected from Personalization
          items:
            $ref: "#/components/schemas/SocialEntry"
        pfp_zoom:
          type: number
          description: The percentage that the PFP can be zoomed in as an integer greater than 100 
          example: 125
        pfp_offset:
          type: array
          items:
            type: integer
          description: The [x,y] offset in pixels from the center of the PFP circle
          example: [-10, 25]
        text_ribbon_gradient:
          type: string
          enum:
          - none
          - linear-XX
          - radial
          description: The gradient of the ribbon colors.
            <br />`none` - no gradient
            <br />`linear-XX` - Linear gradient where `XX` is the degrees offset of the starting point - ex `linear-45`
            <br />`radial` - Radial gradient from the center of the ribbon
          example:
        socials_color:
          type: string
          description: ""
          example:
        circuit_color:
          type: string
          description: ""
          example:
    FilterType:
      type: string
      example: ultra_rare
      description: |-
        Filter Types:
        <br />`handle`, 
        <br />`handlehex` (without CIP-67 label), 
        <br />`assetname` (with CIP-67 label), 
        <br />`holder` (bech32 stake address, bech32 script address, or bech32 "enterprise" address),
        <br />`bech32stake`, 
        <br />`bech32address`,
        <br />`hexaddress`,
        <br />`paymentkeyhash`, or
        <br />`stakekeyhash`
      enum:
      - handle
      - handlehex
      - assetname
      - holder
      - bech32stake
      - bech32address
      - hexaddress
      - paymentkeyhash
      - stakekeyhash
    Handle:
      required:
      - name
      type: object
      properties:
        hex: 
          type: string
        name:
          type: string
          example: my.handle
        handle_type:
          type: string
          $ref: "#/components/schemas/HandleType"
          description: Handle, NFT SubHandle, or Virtual SubHandle
        virtual:
          type: object
          description: Additional information only available on Virtual SubHandles
          properties:
            expires_time: 
              type: number
              description: The POSIX time the Virtual SubHandle expires
            public_mint: 
              type: boolean
              description: True if this Virtual SubHandle was publically minted
        holder:
          type: string
          description: Current Holder of the Handle (see the Holder endpoints for more information)
          example: stake1uxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        holder_type:
          $ref: "#/components/schemas/AddressType"
        image:
          type: string
          description: IPFS URL of the personalized handle image
          example: ipfs://hash_of_personalized_image
        standard_image:
          type: string
          description: IPFS URL of the factory default handle image
          example: ipfs://hash_of_default_image
        image_hash:
          type: string
          description: SHA256 Hash of the personalized handle image
          example: 05dbb47e32ad6b89074c286a73543bdb957c01f7abf82b2f106584dc99432bb1
        standard_image_hash:
          type: string
          description: SHA256 Hash of the default image data
          example: 05dbb47e32ad6b89074c286a73543bdb957c01f7abf82b2f106584dc99432bb1
        length:
          type: integer
          example: 9
          description: Length of the root Handle
        og:
          type: boolean
          description: OG status
          example: 0
        og_number:
          type: integer
          description: Limited edition OG number. 0 means not an OG.
          example: 0
        rarity:
          $ref: "#/components/schemas/Rarity"
        characters:
          $ref: "#/components/schemas/Characters"
        numeric_modifiers:
          $ref: "#/components/schemas/NumericModifiers"
        sub_length:
          type: number
          description: Total length of the SubHandle, including `@` and root Handle
        sub_rarity:
          $ref: "#/components/schemas/Rarity"
        sub_characters:
          $ref: "#/components/schemas/Characters"
        sub_numeric_modifiers:
          $ref: "#/components/schemas/NumericModifiers"
        default_in_wallet:
          type: string
          description: The name of the default Handle in this wallet
          example: my_default_hndl
        pfp_image:
          type: string
          description: IPFS hash of the selected profile pic
          example: ipfs://Q2de4Fg56tNHy82300000001
        bg_image:
          type: string
          description: IPFS hash of the selected background
          example: ipfs://Q2de4Fg56tNHy82300000001
        pfp_asset:
          type: string
          description: Hex string of policy id and asset name of the pfp_image on chain asset
          example: 94da605878403d07c144fe96cd50fe20c16186dd8d171c78ed6a8768436c6179436861726c6f74746538353338
        bg_asset:
          type: string
          description: Hex string of policy id and asset name of the bg_image on chain asset
          example: b8842fe3a0eae5011252c16566995d2c8f1bae85d380410cd21ea91f000de140556e646572776f726c645f48616e646c65735f6267
        resolved_addresses:
          type: object
          properties:
            ada:
              type: string
              example: addr1e00000000000000000000000000000000000001
            eth:
              type: string
              example: addr1e00000000000000000000000000000000000002
            btc:
              type: string
              example: addr1e00000000000000000000000000000000000003
        original_address:
              type: string
              example: addr1e00000000000000000000000000000000000001
              description: If enabled by the root Handle owner, this will show the address that the SubHandles was originally sent to on mint
        version:
          type: string
          description: The version of the Handle
          example: 1
        svg_version:
          type: string
          description: The version of the Handle image renderer that rendered the main nft image
          example: 1
        utxo:
          type: string
          description: The transaction hash and index number (UTxO) that the Handle is in. In the format of `txhash#index`
          example: 8f1d7ec063ce83d93d1bad658886e81568d19ca9bd8dd0e6e268d7be3e33c653#1
        lovelace:
          type: integer
          description: The lovelace amount in the UTxO the Handle is in
        has_datum:
          type: boolean
          description: "`true` if the UTxO that the Handle is in also has a datum value"
        pz_enabled:
          type: boolean
          description: >-
            Capability flag: whether personalization is *allowed* for this Handle. Root Handles
            default to `true`; for SubHandles it reflects the root Handle's SubHandle settings.
            This does NOT indicate that the Handle has actually been personalized — for that, use
            `is_personalized`.
          example: true
        is_personalized:
          type: boolean
          description: >-
            State flag: whether the Handle (or SubHandle) has actually *been* personalized in any
            way — as distinct from `pz_enabled`, which only means personalization is allowed. True
            for any applied personalization: a chosen (or creator/partner default-applied)
            background or profile picture (`bg_image`/`pfp_image`/`bg_asset`/`pfp_asset` or a
            rendered image that differs from the standard image), any `portal`, `designer`, or
            `socials`/URL content, or custom resolved chain addresses (any `resolved_addresses`
            entry beyond the auto-resolved `ada`, e.g. `btc`/`eth`). Use the `personalized` query
            parameter on the handle-list endpoints to filter by this.
          example: true
        created_slot_number:
          type: integer
          description: The slot number this Handle was minted
        updated_slot_number:
          type: integer
          description: The slot number this Handle was updated
    HandleType:
      type: string
      description: |-
        Handle Types:
        <br />`Handle`
        <br />`NFT SubHandle` 
        <br />`Virtual SubHandle`
      enum:
      - handle
      - nft_subhandle
      - virtual_subhandle
    ScriptType:
      type: string
      description: |
        Family slug emitted in `/scripts` response payloads. The slug is the part of the deployment-handle name (`<slug><ordinal>@handlecontract`) that comes before the trailing digits — `pers1@handlecontract` has slug `pers`, `persprx1@handlecontract` has slug `persprx`. Any slug that exists on chain can appear; there is no fixed enum.
      example: pers
    HexString:
      type: string
      example: "0x1a3dfb"
    Holder:
      type: object
      properties:
        total_handles:
          type: integer
          example: 1421
          description: Total Handles this Holder holds
        address:
          type: string
          example: stake1d4fg5dghrdxxxxxxxxxxxxxxxxxxx
          description: Stake Key, Enterprise Address, Script Address, or Other Address
        type:
          $ref: "#/components/schemas/AddressType"
        known_owner_name:
          type: string
          example: jpg.store
          description: The name of the vendor/exchange if the address is from a known list of vendors/exchanges/projects. 
        default_handle:
          type: string
          example: my_default_hndl
          description: The default Handle for this Holder 
        manually_set:
          type: boolean
          description: If `true` then the user set this as their default Handle manually.
            If `false`, then a simple algorithm attempted to pick the Holder's best Handle. The algorithm selects in this order -
            <br />OG Handles first
            <br />If no OG Handle then shortest Handle
            <br />If many have the same length, then the earliest minted slot number
            <br />If multiple minted at the same time, then ascending alpha order
    MintingType:
      type: string
      example: nft
      description: |-
        Minting Types (leave blank for all):
        <br />`nft`, 
        <br />`virtual`
      enum:
      - nft
      - virtual
    NumericModifiers:
      type: string
      description: |-
        This property will have one of the following:
          <br />No modifier (blank) is a positive whole number, or not a number
          <br />`negative` - Negative whole number
          <br />`decimal` - Positive decimal
          <br />`negative,decimal` - Negative decimal
          <br />Example:
          <br />`1000` = no modifiers/blank
          <br />`-100` = "negative"
          <br />`10.0` = "decimal"
          <br />`-1.0` = "negative,decimal"
      example: negative,decimal
    Personalization:
      type: object
      properties:
        designer:
          $ref: "#/components/schemas/DesignerSettings"
        portal:
          $ref: "#/components/schemas/PortalSettings"
        socials:
          type: array
          items:
            $ref: "#/components/schemas/SocialEntry"
        trial:
          type: boolean
          description: True if the Handle is using an asset that is still in an "trial" status.
            This can be useful for DApps to display standard_image as opposed to image just in case
            the policy hasn't properly declared NSFW imagery
        nsfw:
          type: boolean
          description: True if the Handle is using an asset that has a "nsfw" status.
            This can be useful for DApps to display standard_image as opposed to image to avoid NSFW imagery
        validated_by:
          type: string
          description: The PubKeyHash of the signer of the personalization transaction that validated the
            personalization. Trusted vendors should be verifying ownership, authenticity, and Handle Standard
            compliance.
    Rarity:
      type: string
      example: ultra_rare
      description: |-
        Handle rarities:
        <br />`basic` - 8-15 characters
        <br />`common` - 4-7 characters
        <br />`rare` - 3 characters
        <br />`ultra_rare` - 2 characters
        <br />`legendary` - 1 character
      enum:
      - basic
      - common
      - rare
      - ultra_rare
      - legendary
    Stats:
      type: object
      properties:
        total_handles:
          type: integer
          example: 195874
          description: "Total of all Handles minted"
        total_holders:
          type: integer
          example: 52167
          description: Total number of Handle Holders including wallets/scripts/enterprise/other addresses
        # We can add `total_subhandles`, `total_<per_rarity>`, `top_holders`
    PortalSettings:
      type: object
      properties:
        type:
          type: string
        domain: 
          type: string
          example: https://handle.me
        custom_settings:
          $ref: "#/components/schemas/HexString"
        default:
          type: boolean
    Script:
      type: object
      description: Handle-backed script metadata resolved from `@handlecontract` subhandles
      properties:
        handle:
          type: string
        handleHex: 
          type: string
        refScriptUtxo:
          type: string
        refScriptAddress:
          type: string
        validatorHash:
          type: string
        latest:
          type: boolean
        type:
          type: string
          $ref: "#/components/schemas/ScriptType"
        cbor:
          type: string
    SocialEntry:
      type: object
      properties:
        url:
          type: string
          description: Valid URL. Supported schemas - `http://`, `https://`, `mailto:`, `tel:`, `ipfs://`
            Social websites with known host names will be authenticated to reduce fraud/phishing
        display:
          type: string
          description: The display text to show either on the Handle if selected or on the Portal if selected.
    SubHandleSettings:
      type: object
      properties:        
        nft:
          type: object
        virtual:
          type: object
        buy_down_paid:
          type: number
        buy_down_price:
          type: number
        buy_down_percent:
          type: number
        agreed_terms:
          type: string
        payment_address:
          type: string
        migrate_sig_required:
          type: boolean
    UTxO:
      type: object
      properties:
        tx_id:
          type: string
          description: The current UTxO transaction ID 
        index:
          type: integer
          description: The current UTxO index 
        lovelace:
          type: integer
          description: The lovelace in the UTxO 
        datum:
          type: string
          description: The datum CBOR in the UTxO if there is any
        address:
          type: string
          description: The address of the UTxO 
        script:
          description: If known, the script/contract details that the UTxO is locked to, if there is one
          type: object
          $ref: "#/components/schemas/Script"
        reference_script:
          type: string
          description: The reference script (as CBOR) that is saved in this UTxO, if there is one
  requestBodies:
    Handle:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Handle"
  responses:
    RateLimited:
      description: Too many requests. RFC 9239 `RateLimit-*` headers describe the limit and reset.
      headers:
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: HTTP method not supported on this path
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    api-key:
      type: apiKey
      description: Optional header used to bypass rate limiting when enabled (see `RATE_LIMITER_ENABLED` and `WHITELISTED_API_KEYS`).
      name: api-key
      in: header
