---
openapi: 3.0.3
info:
  title: Handles Public API
  description: |-
    ADA Handle Public API.

    Requests do not require authentication by default. If rate limiting is enabled, whitelisted clients may provide an `api-key` header to bypass the limiter.
  termsOfService: https://handle.me/#tou
  contact:
    email: hello@koralabs.io
  license:
    name: Mozilla Public License 2.0
    url: https://github.com/koralabs/handles-public-api/blob/main/LICENSE
  version: "{{version}}"
externalDocs:
  description: Swagger UI
  url: https://api.handle.me/swagger
servers:
- url: https://api.handle.me
tags:
- name: handles
  description: Handle endpoints
  externalDocs:
    description: Related Handle Docs
    url: https://api.handle.me/swagger
- name: holders
  description: Handle holder wallets, scripts, addresses, stats
- name: utils
  description: Handle utility endpoints
paths:
  "/":
    get:
      tags:
      - utils
      summary: API index with content-negotiated discovery links
      description: |
        Returns a pointer to the API's human and machine discovery surfaces. The response is selected via the `Accept` header:

        - Any `Accept` value containing `yaml` (e.g. `application/yaml`, `text/yaml`, `application/x-yaml`) → raw OpenAPI spec (this document).
        - `application/json` (or `*/*` / no `Accept` header) → OpenAPI spec parsed to JSON.
        - `text/plain` → plain-text list of absolute URLs to the Swagger UI, the OpenAPI spec, and the MCP endpoint.
        - `text/html` → HTML page with the same links.
        - Any other media type → `406 Not Acceptable`.
      responses:
        '200':
          description: Discovery payload in the negotiated media type.
          content:
            text/html:
              schema:
                type: string
            text/plain:
              schema:
                type: string
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '406':
          description: No offered media type matches the request `Accept` header.
  "/mcp":
    post:
      tags:
      - utils
      summary: Model Context Protocol endpoint
      description: |
        Streamable HTTP MCP endpoint that accepts JSON-RPC 2.0 requests.
        Supports `initialize`, `ping`, `tools/list`, and `tools/call` methods.
        Exposes read-only tools for handles, holders, and policies (including slot-based handle pagination).
        For MCP `search_handles`, `page` and `slot_number` are mutually exclusive.
      parameters:
      - name: MCP-Protocol-Version
        in: header
        required: false
        schema:
          type: string
          example: "2025-11-25"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: JSON-RPC response body
          headers:
            MCP-Protocol-Version:
              schema:
                type: string
              description: MCP protocol revision used by this server response
          content:
            application/json:
              schema:
                type: object
        '202':
          description: Notification accepted (no response body)
        '400':
          description: Unsupported protocol version header
    get:
      tags:
      - utils
      summary: MCP capability descriptor
      description: |
        SSE transport is disabled, so the JSON-RPC POST is the only valid verb. GET still
        returns `405` but with a discoverability descriptor so MCP clients probing GET
        can self-bootstrap (protocol versions, server info, advertised tools, doc links)
        without out-of-band knowledge.
      responses:
        '405':
          description: GET transport is not enabled; body advertises capability surface
          headers:
            Allow:
              schema:
                type: string
                example: POST
            MCP-Protocol-Version:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  docs:
                    type: string
                  protocol:
                    type: string
                  transport:
                    type: string
                  latest_protocol_version:
                    type: string
                  supported_protocol_versions:
                    type: array
                    items:
                      type: string
                  server_info:
                    type: object
                  tools:
                    type: array
                  links:
                    type: object
  "/openapi.json":
    get:
      tags:
      - utils
      summary: OpenAPI spec (conventional alias)
      description: "Conventional path for the OpenAPI spec; same payload as `GET /` with `Accept: application/json`."
      responses:
        '200':
          description: OpenAPI spec as JSON
          content:
            application/json:
              schema:
                type: object
  "/swagger.json":
    get:
      tags:
      - utils
      summary: OpenAPI spec (Swagger 2-style alias)
      description: Conventional path used by some toolchains; same payload as `/openapi.json`.
      responses:
        '200':
          description: OpenAPI spec as JSON
          content:
            application/json:
              schema:
                type: object
  "/.well-known/api-catalog":
    get:
      tags:
      - utils
      summary: API catalog Linkset (RFC 9727)
      responses:
        '200':
          description: Linkset describing service-doc and service-meta endpoints
          content:
            application/linkset+json:
              schema:
                type: object
  "/.well-known/security.txt":
    get:
      tags:
      - utils
      summary: security.txt (RFC 9116)
      responses:
        '200':
          description: Plain-text security contact / disclosure metadata
          content:
            text/plain:
              schema:
                type: string
  "/handles":
    get:
      tags:
      - handles
      summary: Get all minted handles
      description: Get all minted handles.
        This endpoint will return a plain text list of all Handle names if the
        `Accepts` header is set to `text/plain`. If the `Accepts` header is set
        to `application/json` it will return a paginated list of JSON Handle objects instead.
      parameters:
      - name: search
        in: query
        description: A portion of the handle name to search for 
        required: false
        schema:
          type: string
      - name: characters
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/Characters"
      - name: length
        in: query
        description: Length of handles to return. This will also accept a range. For example `2-7` will get all Handles with a length >=2 and <=7
        required: false
        schema:
          type: integer
      - name: rarity
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/Rarity"
      - name: numeric_modifiers
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/NumericModifiers"
      - name: og
        in: query
        description: Filter for OG Handles
        required: false
        schema:
          type: boolean
      - name: personalized
        in: query
        description: Filter for Personalized Handles
        required: false
        schema:
          type: boolean
      - name: sort
        in: query
        description: Sort results ascending or descending on Handle name
        required: false
        schema:
          type: string
          enum:
            - asc
            - desc
      - name: handle_type
        in: query
        description: Filter for specific Handle types
        required: false
        schema:
          type: string
          enum:
            - virtual_subhandle
            - nft_subhandle
            - handle
      - name: root_handle
        in: query
        description: Filter subhandles by their exact root handle name
        required: false
        schema:
          type: string
      - name: records_per_page
        in: query
        description: Number of Handles to return per page in paginated results. Maximum of 250 for `application/json` and 50000 for `text/plain`.
          Both `application/json` and `text/plain` support pagination. Defaults are 100 for `application/json` and 50000 for `text/plain`.
        required: false
        schema:
          type: integer
      - name: page
        in: query
        description: The page number to return in paginated results. Either `page` or `slot_number` can be
          used in paginated results. Using the `page` parameter will order results by Handle name. This means
          pagination can potentially miss some Handles if Handles are added while paginating. As an alternative
          see `slot_number` below.
        required: false
        schema:
          type: integer
      - name: slot_number
        in: query
        description: The slot number to start at when paginating results. Either `page` or `slot_number` can be
          used in paginated results. Using the `slot_number` parameter will order results by the slot number the
          Handles were created or updated in. Pagination can potentially return the same Handle more than once
          if Handles are added or updated during pagination. As an alternative, see `page` above.
        required: false
        schema:
          type: integer
      - name: holder_address
        in: query
        description: The holder_address key of the wallet/script that the Handle is in. See the Holder endpoints for more information 
        required: false
        schema:
          type: string
      - name: hex
        in: query
        description: Set to `true` if the search is in hex form
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful and up to date
          headers:
            x-handles-search-total:
              schema:
                type: integer
              description: Number of total search results, regardless of pagination
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                example: |-
                  handle123
                  my.handle
                  i-always-hodl
                  ...
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handle"
        '202':
          description: Successful, but scanning is still catching up to the tip of the blockchain
          headers:
            x-handles-search-total:
              schema:
                type: integer
              description: Number of total search results, regardless of pagination
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                example: |-
                  handle123
                  my.handle
                  i-always-hodl
                  ...
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handle"
        '400':
          description: Invalid filter
  "/handles/list":
    post:
      tags:
        - handles
      description: |
        POST an array to match or reverse-lookup minted Handles. 
        This may be combined with the all of the search and filtering
        parameters of the `/handles` endpoint 
        (see [/handles](#/handles/get_handles) for more information), including paginated `text/plain` responses.
      parameters:
      - name: type
        in: query
        schema:
                $ref: "#/components/schemas/FilterType"
      requestBody:
        description: |
          An array of strings that can be any one type of FilterType.
        required: true
        content:
          application/json:
            schema:
                type: array
                items:
                  type: string
            examples:
              handle: 
                value: [ "handle_1", "my_handle_2", "other_handle", "etc..."]
              paymentkeyhash: 
                value: [ "120e95a22031d2cc21d6716788f709074fb89e9b8fbad6284eb8a074", "1771c13e355e10a4203d8948af58d16bce2b28d5f8a02835b0b21811", "b99182d0aba4003c6a80c98c58e24a91ca2ce50d04ea72361c9b9815", "etc..."]
      responses:
        '200':
          description: Successful and up to date
          headers:
            x-handles-search-total:
              schema:
                type: integer
              description: Number of total search results, regardless of pagination
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                example: |-
                  handle123
                  my.handle
                  i-always-hodl
                  ...
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handle"
        '202':
          description: Successful, but scanning is still catching up to the tip of the blockchain
          headers:
            x-handles-search-total:
              schema:
                type: integer
              description: Number of total search results, regardless of pagination
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
                example: |-
                  handle123
                  my.handle
                  i-always-hodl
                  ...
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handle"
        '400':
          description: Invalid filter
  "/handles/{handle}":
    get:
      tags:
      - handles
      description: |
        Returns a single Handle by name (or hex asset name when `hex=true`). Handle name format
        is enforced by the protocol, not by this API: any name that doesn't match the on-chain
        rules simply returns `404` with a docs link, matching how unminted names are returned.
      parameters:
      - name: handle
        in: path
        description: The Handle name
        required: true
        schema:
          type: string
      - name: hex
        in: query
        description: Set to `true` if the `{handle}` is in hex form (full asset name hex, including asset label)
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handle"
        '202':
          description: Successful, but scanning is still catching up to the tip of the blockchain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handle"
        '404':
          description: Handle not found (invalid shape, unminted, or protected). The `docs` field of the error body links to the relevant explanation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '429':
          $ref: "#/components/responses/RateLimited"
        '451':
          description: Handle name matches a protected/legally restricted word.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
