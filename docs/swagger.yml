  "/scripts":
    get:
      tags:
      - utils
      summary: List script metadata by network
      description: |
        Returns one entry for every `<slug><ordinal>@handlecontract` subhandle that has inline script CBOR. There is no curated allow-list of contract families — whatever is on chain shows up here.

        Response object keys are the script addresses derived from each validator hash. `refScriptAddress` is the on-chain address of the handle that holds the reference script UTxO. `type` is the family slug (the slug minus its trailing digits) — `pers1@handlecontract` has type `pers`, `persprx1@handlecontract` has type `persprx`.

        Within each family the highest ordinal that has script CBOR is marked `latest: true`. Latest entries are emitted first so JSON-iteration order surfaces them up front.
      parameters:
      - name: latest
        in: query
        description: When `true`, only entries marked `latest` are returned (one per family that has a script). Combine with `type` to scope to specific families.
        required: false
        schema:
          type: boolean
      - name: type
        in: query
        description: |
          Optional `startsWith` filter on the slug part of the handle name (everything before `@handlecontract`).

          - `type=pers` returns every family whose slug begins with `pers` — `pers`, `persprx`, `perspz`, `perslfc`, `persdsg`, …
          - `type=persprx` returns only `persprx<n>` entries.

          The match is case-insensitive and applied to the full slug including its ordinal, so any prefix that uniquely identifies a family also works.
        required: false
        schema:
          type: string
          example: pers
      responses:
        '200':
          description: Script metadata keyed by derived script address. Returns `{}` if no families match the filter.
          content:
            application/json:
              schema:
                type: object
