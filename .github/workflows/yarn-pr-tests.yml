name: NPM Tests

on:
  push:
    branches: [ preview, preprod, mainnet ]
  pull_request:
    branches: [ preview ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
