name: Yarn PR Tests

on:
  push:
    branches: [ preview, preprod, mainnet ]
  pull_request:
    branches: [ preview ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 18
      - run: yarn
      - run: yarn test
