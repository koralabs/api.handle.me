name: Docker Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [ preview, preprod, mainnet ]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - rollup.lambda.config.js
      - rollup.package.json
      - app.ts
      - express.ts
      - ioc/**
      - lambdas/**
      - middlewares/**
      - routes/**
      - shell/entrypoint.sh
      - shell/install.sh
      - shell/test-container.sh
      - workers/**
  pull_request:
    branches: [ preview ]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - rollup.lambda.config.js
      - rollup.package.json
      - app.ts
      - express.ts
      - ioc/**
      - lambdas/**
      - middlewares/**
      - routes/**
      - shell/entrypoint.sh
      - shell/install.sh
      - shell/test-container.sh
      - workers/**

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify local test evidence (tests run locally, never in Actions)
        run: |
          c=$(jq -er 'select(.result == "pass") | .commit' .local-test-evidence.json) && git diff --quiet "$c" HEAD -- . ':!.local-test-evidence.json' || { echo "::error::no valid local test evidence for this commit: run adahandle-deployments/common/test-evidence.sh record locally and push the evidence commit"; exit 1; }
